version: 2.1

orbs:
  ruby: circleci/ruby@2.5.0
  qlty: qltysh/qlty-orb@0.0.11

executors:
  default:
    parameters:
      ruby-version:
        description: "ruby version tag"
        default: "3.4.7"
        type: string
    docker:
      - image: cimg/ruby:<<parameters.ruby-version>>

jobs:
  doc:
    executor: default
    steps:
      - checkout
      - ruby/install-deps
      - run: bundle exec yard doc
      - store_artifacts:
          path: doc
          destination: doc

  rspec:
    parameters:
      ruby-version:
        description: "ruby version tag"
        type: string
    executor:
      name: default
      ruby-version: <<parameters.ruby-version>>
    steps:
      - checkout
      - ruby/install-deps
      - ruby/rspec-test
      - qlty/coverage_publish:
          files: ./coverage/.resultset.json

  rubocop:
    executor: default
    steps:
      - checkout
      - ruby/install-deps
      - ruby/rubocop-check

  release:
    executor: default
    steps:
      - checkout
      - ruby/install-deps
      # `rake release` derives the tag name from version.rb. When it differs from the tag being built it tries
      # to create the missing tag, which fails on a container with no git identity — and because
      # `release:source_control_push` runs before `release:rubygem_push`, the gem builds and is never pushed.
      # Fail here instead, where the cause is obvious.
      - run:
          name: Verify tag matches version
          command: |
            VERSION=$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' lib/omniai/google/version.rb | head -1)
            if [ "v$VERSION" != "$CIRCLE_TAG" ]; then
              echo "Tag $CIRCLE_TAG does not match version.rb ($VERSION). Tag the commit that carries the matching version."
              exit 1
            fi
      - run:
          name: Configure git identity
          command: |
            git config user.email "circleci@users.noreply.github.com"
            git config user.name "CircleCI"
      - run: bundle exec rake release

workflows:
  version: 2.1
  build:
    jobs:
      - doc
      - rspec:
          matrix:
            parameters:
              ruby-version:
                - "3.4.7"
                - "3.3.7"
                - "3.2.7"
      - rubocop
      - release:
          filters:
            branches:
              ignore: /.*/
            tags:
              only: /^v\d+\.\d+\.\d+$/
